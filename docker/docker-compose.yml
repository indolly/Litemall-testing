version: '3'
services:
  mysql57:
    image: mysql:5.7
    container_name: mysql
    ports:
      - "13307:3306"
    command:
      --character-set-server=utf8
      --collation-server=utf8_general_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - ./db/conf.d:/etc/mysql/conf.d
      - ./db/data:/var/lib/mysql
      - ./db/init-sql:/docker-entrypoint-initdb.d
    environment:
      MYSQL_ROOT_PASSWORD: ${LITEMALL_DB_ROOT_PASSWORD:?Please set LITEMALL_DB_ROOT_PASSWORD in .env}
    restart: always
  litemall:
    build:
      context: litemall
      dockerfile: Dockerfile
    container_name: litemall
    ports:
      - "8081:8080"
    volumes:
      - ./litemall/storage:/storage
      - ./litemall/logs:/logs
      - ./litemall/backup:/backup
      - /etc/localtime:/etc/localtime
    environment:
      TZ: Asia/Shanghai
      LITEMALL_DB_USERNAME: ${LITEMALL_DB_USERNAME:?Please set LITEMALL_DB_USERNAME in .env}
      LITEMALL_DB_PASSWORD: ${LITEMALL_DB_PASSWORD:?Please set LITEMALL_DB_PASSWORD in .env}
      LITEMALL_WECHAT_APP_SECRET: ${LITEMALL_WECHAT_APP_SECRET:-}
    depends_on:
      - mysql57
    restart: always
